<form (ngSubmit)="onSubmit(titleInput.value, ticketInput.value)" #form> <!-- private form = viewChild.required<ElementRef<HTMLFormElement>>('form'); -->
    <app-control label="Title">
        <!--
        control.component.ts
        Selecting injected input by looking for template variable named input
        #input
            @ContentChild('input') private control?: ElementRef<
                HTMLInputElement | HTMLTextAreaElement
            >;
        -->
        <input name="title" id="title" #titleInput #input />
    </app-control>
    <app-control label="Request">
        <textarea name="request" id="request" rows="3" #ticketInput #input></textarea>
    </app-control>
    <p>
        <button appButton #btn>
            Submit
            <span ngProjectAs="icon"> ⌲ </span>
        </button>
    </p>
</form>
