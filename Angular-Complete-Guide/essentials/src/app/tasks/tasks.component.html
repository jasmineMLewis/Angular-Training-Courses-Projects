@if(isAddingTask) {
    <!-- <app-new-task [userId]="userId" (cancel)="onCancelAddTask()" (add)="onAddTask($event)" /> -->
    <app-new-task [userId]="userId" (close)="onCloseAddTask()" />
}

<section id="tasks">
    <header>
        <h2>{{ name }}'s Tasks</h2>
        <menu>
            <button (click)="onStartAddTask()">Add Task</button>
        </menu>
    </header>

    <ul id="tasks">
        @for(task of selectedUserTasks; track task.id){
        <li>
            <!-- <app-task [task]="task" (complete)="onCompleteTask($event)"></app-task> -->
            <app-task [task]="task"></app-task>
        </li>
        }
    </ul>
</section>
